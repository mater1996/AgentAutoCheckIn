# 活动配置 · 目标驱动形态（v2）
#
# 与旧形态的区别：不再写死「做几次」，而是声明
#   要什么（objective） → 现在怎么样（probes） → 做什么（task） → 怎么领（collect）
# 终止条件由引擎按档位价值算出来，不是配置里写的数字。
#
# 旧形态（一条 flow 数组）仍然支持，见 jd.yaml。

app: taobao
activities:
  - id: tb_coin
    name: 淘金币
    account_id: tb_main
    asset_id: taobao_coins
    window: ["09:00", "21:00"]
    budget_ms: 1200000          # 20 分钟硬保险丝（objective.max_seconds 是第一道闸）

    # ── ① 目标：追档位，不追次数 ──
    objective:
      strategy: all_tiers       # 追完所有可达档位
      max_seconds: 900          # 15 分钟上限（17 个任务 × 35s ≈ 10 分钟，留余量）
      min_marginal_cny_per_hour: 20   # 只在档位全达成后才用这条件筛选
      unit_reward: 30           # 单任务约 30 金币（待实测校准）
      unit_seconds: 35          # 单任务约 35 秒

    # ── ② 档位阶梯：引擎据此算跨档价值 ──
    tiers:
      - { at: 3,  reward: 30 }
      - { at: 10, reward: 50 }
      - { at: 20, reward: 100 }

    # ── ③ 进入任务页（含进入前余额） ──
    # 页面身份由实际截图确认；只导航，不领取或执行任务。
    entry:
      - do: ai
        say: >-
          只进入当前淘宝账号的淘金币赚金币任务列表面板。
          如果当前已展开任务列表就不操作；若在淘金币活动主页，只点明确的去赚金币/赚更多金币/做任务入口；
          若在淘宝其他页面，通过实际可见的领淘金币入口进入再打开任务列表。
          停在能看到任务名称、配额和操作按钮的面板。不做任务、不领取、不购物、加购、支付、授权或切账号。
          遇登录验证码立即停止。不根据Activity名称或旧坐标判断页面。
      - do: read
        as: before
        say: 页面左上角「淘金币」旁边显示的数字是多少？只回复数字，不要单位和逗号

    # 返回后面板关闭时只恢复入口，不执行任务。
    recover:
      - do: ai
        say: >-
          只恢复当前淘金币活动的赚金币任务面板。若已在列表则停止；
          若在本次打开的普通任务商品页/搜索页，可逐页返回并确认，最多返回两次；不要点击商品或完成任务。
          若在活动主页，点击实际可见的去赚金币/赚更多金币/做任务入口。
          不点击任务、领取、购买、加购、支付、授权或切账号；无法确认页面、入口或遇登录验证码就停止。

    probes:
      # 一次调用同时拿进度与剩余任务数：两次分开问会出现口径不一致
      - id: state
        ask: '只回复 JSON，不要其他文字：{"progress":"今日累计奖励的完成进度，形如 6/20","tasks_left":任务列表里还显示「去完成」或「去逛逛」的条目数量}'
        parse: json

    # 通用执行器依据实际说明分段打开、执行、取回执、返回。
    task:
      completion_markers:
        - '任务已完成 继续逛逛吧'
        - '任务已完成，继续逛逛吧'
      steps:
        - do: ai
          say: 仅执行本轮计划选中的任务，按实际页面要求操作，不按任务名称或输入框猜测执行方式。

    # ── ⑥ 领奖励 ──
    collect:
      when: claimable
      probe: 页面上是否存在可点击的「立即领取」按钮
      steps:
        - do: ai
          say: 点击页面上方的「立即领取」按钮
          optional: true

    # ── ⑦ 结算 ──
    settle:
      read: after
      # 面板已独立确认，直接同口径读数，不额外返回关闭它。
      say: 页面左上角「淘金币」旁边显示的数字是多少？只回复数字，不要单位和逗号

    verify:
      # 只放"已领/已签"语义，不放平台名（否则页面上到处都有，会误判 ALREADY）
      any: [已领取, 明天再来, 已领完, 今日累计奖励已领]
      # 余额涨了也算成功（余额差优先于文案）
      balance_grew_counts: true
