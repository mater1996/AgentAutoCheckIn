# 京东。签到形态与淘宝不同：京东是真正的单点签到（入口这一期叫「立即刮卡」）。
# 这份配置验证「同一套引擎能吃不同形态的流程」——差异只在步骤序列，执行器无平台分支。
#
# ⚠️ 2026-10-30 实测补充：京豆的刮卡是「任务门控」的。
#    页面提示「做任务解锁刮卡」时，说明当天还没做够前置任务，直接点刮卡必定失败。
#    完整形态是：做任务 → 解锁刮卡 → 刮卡领京豆。要吃到这部分得在刮卡前加一段 repeat
#    （参考 taobao.yaml 的 repeat 写法，dwell 15~20s）。
#    当前先不做任务（耗时 + 风控），只保留「刮卡可点时就点」的路径。
#
# 配置规范（踩过的坑）
#   1. verify.any 里绝不能放平台名（如「京豆」）——页面到处都有，会误判 ALREADY
#   2. read 必须自带 say，点名读哪种资产
#   3. before / after 必须读「同一个指标」：京豆总额显示在「我的」页，
#      而「京豆」页显示的是"今日获得 3"。实测 888 → 3 相减得 -885。
#   4. 签到后会弹出「做任务解锁刮卡」浮层，back 退不回去 → 读 after 前必须先关闭浮层
#      再确认回到个人中心，否则又读到京豆页的数字

app: jd
activities:
  - id: jd_bead_signin
    name: 京东京豆签到
    account_id: jd_main
    asset_id: jd_beads
    window: ["08:00", "22:00"]
    budget_ms: 220000

    flow:
      # 1. 进「我的」页（京豆总额在这里显示，两次读数都基于这页）
      - do: ai
        say: 点击底部导航栏的「我的」，进入个人中心

      # 2. 记录签到前京豆总额
      - do: read
        as: before
        say: 页面上显示的「京豆」总数是多少？只回复数字，不要单位和逗号

      # 3. 进京豆页
      - do: ai
        say: 点击页面上的「京豆」入口，进入京豆页面
        optional: true

      # 4. 单点签到。这一期入口叫「立即刮卡」
      - do: ai
        say: 点击页面上的「立即刮卡」按钮
        optional: true

      # 5. 兜底：万一文案回到「签到」
      - do: ai
        say: 如果页面上还有「签到」或「立即签到」按钮，点它
        optional: true

      # 6. 领签到奖励
      - do: ai
        say: 如果出现「领取」或「立即领取」按钮，点它把奖励领掉
        optional: true

      # 7. 关闭签到后弹出的浮层/弹窗（这一步很关键：浮层会挡住导航）
      - do: ai
        say: 关闭页面上所有弹窗和浮层（点 X、关闭、我知道了、或点空白处）
        optional: true

      # 8. 回到「我的」页，保证两次读数同指标
      - do: back
        wait: 2

      - do: ai
        say: 确认当前在京东「我的」（个人中心）页面，如果不在，点击底部导航栏的「我的」
        optional: true

      # 9. 记录签到后京豆总额
      - do: read
        as: after
        say: 页面上显示的「京豆」总数是多少？只回复数字，不要单位和逗号

    verify:
      any: [已签到, 签到成功, 明天再来, 明日再来, 已连续签到]
      balance_grew_counts: true
